---
cluster:
  - "zurada"
form:
  - bc_job_name
  - bc_account
  - modules
  - bc_queue
  - global_job_type
  - global_enable_mem
  - bc_num_nodes
  - global_num_cores
  - global_mem
  - bc_num_hours
  - global_gpus
  - global_enable_vis
  - global_gpu_type
  - global_enable_debug
  - bc_vnc_resolution
  - bc_email_on_started
attributes:
  bc_job_name:
    widget: "text_field"
    label: "Job Name"
    value: "Matlab"
    required: true
  modules:
    value: "matlab"
    label: "Modules to load"
  bc_vnc_resolution:
    required: true
  bc_queue:
    widget: "text_field"
    required: true
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false
    help: "Select your project directory; defaults to $HOME"
  