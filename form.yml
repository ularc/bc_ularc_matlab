---
cluster:
  - "zurada"
form:
  - bc_job_name
  - bc_account
  - modules
  - working_dir
  - bc_queue
  - global_num_cores
  - bc_num_hours
attributes:
  bc_job_name:
    widget: "text_field"
    label: "Job Name"
    value: "matlab"
    required: true
  modules:
    value: "matlab"
    label: "Modules to load"
  bc_vnc_resolution:
    required: true
  bc_queue:
    widget: "text_field"
    required: true
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false
    help: "Select your project directory; defaults to $HOME"
  